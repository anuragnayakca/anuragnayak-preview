<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1117">
  <meta name="author" content="{{ site.data.site.advisor_name }}">
  <meta property="og:site_name" content="{{ site.data.site.advisor_name }}">
  <meta property="og:locale" content="en_CA">
  <meta property="og:image" content="{{ '/assets/images/social-card.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/images/social-card.png' | absolute_url }}">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
  <script type="application/ld+json">{
    "@context":"https://schema.org",
    "@type":"Person",
    "name":"{{ site.data.site.advisor_name }}",
    "jobTitle":"{{ site.data.site.professional_title }}",
    "url":"{{ site.url }}",
    "email":"{{ site.data.site.email }}",
    "sameAs":["{{ site.data.site.linkedin }}","{{ site.data.site.facebook }}"]
  }</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">{{ content }}</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
