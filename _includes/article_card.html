<article class="article-card" data-article-card data-title="{{ include.post.title | downcase | escape }}" data-category="{{ include.post.category | downcase | escape }}" data-tags="{{ include.post.tags | join: ' ' | downcase | escape }}">
  <a class="article-image" href="{{ include.post.url }}" aria-label="Read {{ include.post.title }}">
    <img src="{{ include.post.featured_image | default: site.data.site.social_image }}" alt="{{ include.post.featured_image_alt | default: include.post.title }}" loading="lazy" width="1200" height="630">
  </a>
  <div class="article-card-body"><p class="article-kicker">{{ include.post.category | default: 'Insights' }}</p><h2><a href="{{ include.post.url }}">{{ include.post.title }}</a></h2><p>{{ include.post.excerpt_text | default: include.post.description }}</p><div class="article-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time><span>•</span><span>{{ include.post.read_time | default: '5 min read' }}</span></div><a class="text-link" href="{{ include.post.url }}">Read Article</a></div>
</article>
