hero:
  eyebrow: "INSURANCE ADVISOR | BC • AB • ON"
  title: "Helping Canadian professionals, families and business owners navigate insurance, workplace benefits and investment options with clarity and confidence."
  support: "Understand what you already have, identify what may need attention and explore your options through a practical, no-pressure conversation."
  primary_label: "Book a Consultation"
  secondary_label: "Explore Services"
start:
  eyebrow: "START WITH WHAT YOU ALREADY HAVE"
  title: "Good decisions begin with a clear understanding of your current situation."
  body: "You may already have workplace benefits, personal insurance, business coverage or registered accounts. The first step is understanding what each one provides, how the pieces fit together and whether anything deserves a closer look."
  points:
    - "Review existing coverage, benefits and accounts"
    - "Understand important features, limitations and conditions"
    - "Identify unanswered questions, duplication or possible gaps"
    - "Consider whether current arrangements still reflect your life and responsibilities"
    - "Evaluate alternatives only where there is a clear reason"
audiences:
  eyebrow: "WHO I HELP"
  title: "Different responsibilities. The same need for a clearer picture."
  intro: "Technology is part of my professional background, but my practice is not limited to one industry. I work with professionals from different fields, business owners and families."
  cards:
    - title: "Professionals"
      text: "Understand how your workplace benefits, personal coverage and investment accounts fit together, especially when your career, income or responsibilities change."
      note: "Particular familiarity with technology professionals, contractors, managers and professionals with demanding careers."
      url: "/who-i-help/professionals/"
      cta: "For Professionals"
    - title: "Business Owners"
      text: "Review the insurance and benefit arrangements connected to your business, the people who depend on it and the responsibilities you have built around it."
      note: "Includes owner protection, key-person considerations, employee benefits and continuity questions."
      url: "/who-i-help/business-owners/"
      cta: "For Business Owners"
    - title: "Families"
      text: "Bring greater clarity to the coverage, savings decisions and financial responsibilities connected to your income, home, children and long-term plans."
      note: "Review workplace and personal coverage alongside changing family responsibilities."
      url: "/who-i-help/families/"
      cta: "For Families"
services:
  eyebrow: "SERVICES"
  title: "Review the decisions behind the products."
  intro: "The objective is not to begin with a product. It is to understand the responsibility or decision first, then consider what options may be appropriate."
  cards:
    - title: "Personal Insurance"
      text: "Review how life, critical illness and disability coverage may help address the financial impact of death, serious illness or an interruption to your ability to earn an income."
      url: "/services/personal-insurance/"
    - title: "Business Insurance"
      text: "Explore insurance considerations connected to ownership, key people, business obligations and continuity."
      url: "/services/business-insurance/"
    - title: "Employee Benefits"
      text: "Consider benefit options that support employees while reflecting the needs, size and budget of the business."
      url: "/services/employee-benefits/"
    - title: "Registered Investment Options"
      text: "Understand how RRSPs, TFSAs, FHSAs, RESPs and RDSPs differ in purpose, eligibility, contribution rules and access to funds."
      url: "/services/registered-investments/"
    - title: "Non-Registered Investment Options"
      text: "Explore where non-registered options may fit after considering liquidity, time horizon, risk, taxation and available registered room."
      url: "/services/non-registered-investments/"
    - title: "Insurance Policy Reviews"
      text: "Review whether existing policies still reflect your family, income, employment, debt, business and current priorities."
      url: "/services/policy-reviews/"
process:
  eyebrow: "HOW IT WORKS"
  title: "A review before a recommendation."
  steps:
    - title: "Understand your current position"
      text: "Review the coverage, benefits, accounts, responsibilities and priorities already in place."
    - title: "Clarify what deserves attention"
      text: "Identify important questions, possible gaps, duplication or arrangements that may no longer reflect your circumstances."
    - title: "Evaluate appropriate options"
      text: "Discuss possible approaches based on your needs, eligibility, budget, risk tolerance, time horizon and applicable licensing requirements."
background:
  eyebrow: "WHY THIS APPROACH"
  title: "A strong income is only one part of the picture."
  paragraphs:
    - "Many of us spend years building our skills, advancing our careers and working to increase our income. Along the way, we often rely on workplace benefits while insurance, savings and investments are set up at different times, without a clear understanding of how everything works together."
    - "Regular saving is valuable, but it does not by itself show whether your accounts fit your goals or whether the risks around your income and responsibilities have been addressed."
    - "Having spent more than two decades in corporate IT across technical and leadership roles, I understand how easy it is to focus on projects, skill development and career progression while these financial decisions are postponed. I help professionals, families and business owners understand what they already have, assess the risks around their income and responsibilities, and make more deliberate decisions."
faq:
  eyebrow: "COMMON QUESTIONS"
  title: "Before you book"
  items:
    - question: "What happens during the first consultation?"
      answer: "We start with your current situation: what you already have, what has changed, and what questions you want to answer. The purpose is to decide whether a further review would be useful, not to assume you need a product."
    - question: "Is the consultation a sales meeting?"
      answer: "No. The first conversation is intended to understand your situation and determine whether there is something worth reviewing. A product recommendation is not assumed."
    - question: "Can you review insurance I already own?"
      answer: "Yes. Existing policies can be reviewed for coverage, ownership, beneficiaries, renewal or conversion features, riders, premium structure and whether the policy still reflects your circumstances."
    - question: "Can you help me understand my workplace benefits?"
      answer: "Yes. We can review what your workplace plan provides and discuss how it may interact with personal coverage. Workplace plans vary, so the plan documents remain the authoritative source for your benefits."
    - question: "Do you work only with technology professionals?"
      answer: "No. My professional background gives me particular familiarity with technology careers, but I work with professionals from different fields, along with families and business owners."
    - question: "Which provinces do you serve?"
      answer: "I am licensed to provide insurance services in British Columbia, Alberta and Ontario. Product and service availability may vary by province and applicable licensing requirements."
    - question: "Do you provide home or automobile insurance?"
      answer: "No. My practice focuses on life and health insurance, business protection, employee benefits, policy reviews, and eligible registered and non-registered investment options."
    - question: "Can you help with registered and non-registered investment options?"
      answer: "Eligible registered and non-registered investment options may be discussed through applicable licensed channels, subject to suitability, eligibility, product availability and compliance requirements."
    - question: "Can we meet by Zoom?"
      answer: "Yes. Zoom appointments are available for residents of British Columbia, Alberta and Ontario. In-person meetings may also be available in the Nanaimo area where practical."
final_cta:
  title: "Start with a clearer understanding of what you already have."
  text: "Book a no-pressure conversation about your current insurance, workplace benefits, business needs or investment questions."
  button: "Book a Consultation"
