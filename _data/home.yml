hero:
  eyebrow: "INSURANCE ADVISOR | BC • AB • ON"
  title: "How well do your insurance, benefits and investment options fit together?"
  support: "I help Canadian professionals, families and business owners understand what they already have, what may deserve attention and what options are worth considering."
  detail: "No pressure to change what is already working."
  primary_label: "Book a Consultation"
  secondary_label: "Explore Services"
start:
  eyebrow: "START WITH WHAT YOU ALREADY HAVE"
  title: "Before changing anything, understand the current setup."
  body: "The goal is not to find a problem in every area. It is to see what is working, what has changed and what deserves a closer look."
  points:
    - title: "What you have"
      text: "Coverage, benefits, policies and accounts already in place."
    - title: "What changed"
      text: "Career, income, family, mortgage or business responsibilities."
    - title: "What is unclear"
      text: "Features, limitations, ownership, access, risk or coordination."
    - title: "What deserves attention"
      text: "Only the areas where a closer review may be useful."
audiences:
  eyebrow: "WHO I HELP"
  title: "Different responsibilities. The same need for a clearer picture."
  intro: "My technology background gives me particular familiarity with demanding careers, but the practice is broader than one profession."
  cards:
    - title: "Professionals"
      text: "Workplace benefits, income protection, career changes and investment options."
      url: "/who-i-help/professionals/"
      cta: "For Professionals"
    - title: "Business Owners"
      text: "Owner protection, key people, employee benefits and business continuity."
      url: "/who-i-help/business-owners/"
      cta: "For Business Owners"
    - title: "Families"
      text: "Income protection, mortgage responsibilities, education savings and changing needs."
      url: "/who-i-help/families/"
      cta: "For Families"
services:
  eyebrow: "SERVICES"
  title: "What can we review?"
  intro: "Choose an area to see the questions a review can help clarify. The detailed service pages explain the considerations, limitations and next steps."
  cards:
    - title: "Personal Insurance"
      short: "Life, critical illness and disability coverage in the context of income and responsibilities."
      url: "/services/personal-insurance/"
      points: ["Life insurance", "Critical illness", "Disability insurance", "Workplace + personal coverage"]
    - title: "Insurance for Business Owners"
      short: "Life and living-benefit considerations connected to ownership, key people, obligations and continuity."
      url: "/services/business-insurance/"
      points: ["Owner protection", "Key-person considerations", "Buy-sell funding", "Business obligations"]
    - title: "Employee Benefits"
      short: "Benefit options that reflect the needs, size and budget of the business."
      url: "/services/employee-benefits/"
      points: ["Health & dental", "Group life", "Disability benefits", "Plan review & design"]
    - title: "Registered Investment Options"
      short: "Understand the different purposes and rules of common registered account structures."
      url: "/services/registered-investments/"
      points: ["RRSP", "TFSA", "FHSA", "RESP & RDSP"]
    - title: "Non-Registered Investment Options"
      short: "Consider flexibility, liquidity, time horizon, risk and taxation outside registered accounts."
      url: "/services/non-registered-investments/"
      points: ["Liquidity", "Time horizon", "Risk tolerance", "Tax considerations"]
    - title: "Insurance Policy Reviews"
      short: "Understand an existing policy before deciding whether anything should change."
      url: "/services/policy-reviews/"
      points: ["Coverage & purpose", "Ownership & beneficiaries", "Renewal & conversion", "Changes in circumstances"]
business_spotlight:
  eyebrow: "FOR BUSINESS OWNERS"
  title: "The business creates responsibilities beyond the owner."
  text: "A business review can look at the people, obligations and benefit arrangements that depend on the company, without beginning with a complicated tax strategy."
  cards:
    - title: "Owner Protection"
      text: "Personal and business responsibilities connected to the owner."
    - title: "Key People"
      text: "Financial impact if someone important to the business cannot continue."
    - title: "Employee Benefits"
      text: "Health, dental, life and disability options for employees."
    - title: "Continuity"
      text: "Buy-sell funding, debt and other ownership-transition considerations."
process:
  eyebrow: "HOW IT WORKS"
  title: "A review before a recommendation."
  steps:
    - title: "Understand"
      text: "Review what is already in place and what has changed."
    - title: "Clarify"
      text: "Identify the questions or responsibilities that deserve attention."
    - title: "Evaluate"
      text: "Consider appropriate options only where there is a clear reason."
background:
  eyebrow: "FROM TECHNOLOGY TO FINANCIAL CLARITY"
  title: "More than two decades in corporate IT."
  paragraphs:
    - "Having spent more than two decades in corporate IT across technical and leadership roles, I understand how easily projects, skill development and career progression can push insurance, benefits and investment reviews down the list."
    - "Today, I help professionals, families and business owners step back, understand what they already have and make more deliberate decisions without unnecessary pressure."
faq:
  eyebrow: "COMMON QUESTIONS"
  title: "Before you book"
  items:
    - question: "What happens during the first consultation?"
      answer: "We start with your current situation: what you already have, what has changed and what questions you want to answer. The purpose is to decide whether a further review would be useful, not to assume you need a product."
    - question: "Do you work only with technology professionals?"
      answer: "No. My professional background gives me particular familiarity with technology careers, but I work with professionals from different fields, along with families and business owners."
    - question: "Can you review insurance or workplace benefits I already have?"
      answer: "Yes. We can review existing policies and workplace-benefit information to understand what they provide, how they may work together and what questions may deserve attention."
    - question: "Which provinces do you serve?"
      answer: "I am licensed to provide insurance services in British Columbia, Alberta and Ontario. Product and service availability may vary by province and applicable licensing requirements."
final_cta:
  title: "Start with a clearer understanding of what you already have."
  text: "Book a practical, no-pressure conversation about your insurance, workplace benefits, business needs or investment questions."
  button: "Book a Consultation"
